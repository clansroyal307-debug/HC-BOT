<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .heart-container {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.2s infinite;
        }

        .heart {
            position: absolute;
            width: 100px;
            height: 90px;
            background-color: #ff3366;
            transform: rotate(-45deg);
            box-shadow: 0 0 50px #ff3366, 0 0 100px #ff3366;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 90px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            left: 50px;
            top: 0;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.3);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1);
            }
        }

        .text {
            position: absolute;
            bottom: 50px;
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff3366;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <div class="heart"></div>
    </div>

    <div class="text">Seni Seviyorum ❤️</div>

</body>
</html>
